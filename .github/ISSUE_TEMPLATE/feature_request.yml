name: Feature request
description: Propose a change to Homer
body:
  - type: markdown
    attributes:
      value: |
        Everything written here is public: no internal hostnames, ticket IDs, credentials, tokens or private logs.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Homer does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposed-behaviour
    attributes:
      label: Proposed behaviour
      description: What Homer should do instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they are worse.
