# Scheduled and manual checks: the GitHub counterpart of the upstream dependency-check,
# homer-app-mutation and homer-console-mutation-full jobs. The schedule runs only once the
# repository is public: until then the upstream scheduled pipeline covers them, and the private
# repository's Actions minutes go to per-commit CI. workflow_dispatch runs them at any time.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      full-console-mutation:
        description: Also run every console mutant (hours of runner time)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fails on a CVE at or above the configured CVSS threshold (app/app/build.gradle.kts).
  dependency-check:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The NVD database, built from the dependency-check project's mirror, lives in the Gradle user
      # home; a warm cache only fetches the changed feeds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-v2-${{ github.run_id }}
          restore-keys: dependency-check-nvd-v2-
      - name: Dependency check
        id: check
        run: cd app && ./gradlew :app:dependencyCheckAnalyze :homer-runner:dependencyCheckAnalyze --no-configuration-cache --continue
      # Saved whenever both analyses finished, which their reports prove: the plugin writes each after
      # the update and the scan, before failing on a CVE. actions/cache would save only on success, so
      # every run after a finding would start cold. A run that failed or timed out during the NVD
      # update has no report and may hold a partial database, so it is not saved.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') && hashFiles('app/app/build/reports/dependency-check/dependency-check-report.html') != '' && hashFiles('app/homer-runner/build/reports/dependency-check/dependency-check-report.html') != ''
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-check
          path: |
            app/app/build/reports/dependency-check/dependency-check-report.html
            app/homer-runner/build/reports/dependency-check/dependency-check-report.html
          retention-days: 7

  # PIT pilot on a narrow backend scope (ADR-0082): report-only, so a failure warns.
  backend-mutation:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: cd app && ./gradlew :app:pitest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-mutation
          path: app/app/build/reports/pitest/
          retention-days: 7

  # Every console mutant: ~7,500 of them, hours of runner time on a cold incremental cache, so
  # manual only until it is sharded (ADR-0082).
  console-mutation-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full-console-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: console/reports/quality/mutation-console/stryker-incremental.json
          key: console-mutation-incremental-v1-${{ github.run_id }}
          restore-keys: console-mutation-incremental-v1-
      - run: |
          cd console
          npm ci
          npm run mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: console-mutation-full
          path: console/reports/quality/mutation-console/
          retention-days: 7
