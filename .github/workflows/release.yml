# Publishes the backend, runner and console images to GHCR once the full CI passes: the GitHub
# counterpart of the upstream pipeline's build-image jobs. A bare semver tag publishes that version;
# workflow_dispatch builds <branch>-<sha> plus the moving <branch> tag, as the upstream manual jobs do.
# The GitHub repository receives no tags from the upstream sync (ADR-0085), so this runs only after
# development moves to GitHub. Every image is a multi-arch index of a linux/amd64 and a linux/arm64
# build, each built on a native runner. The index and each platform image are signed with cosign
# and carry a CycloneDX SBOM and SLSA build provenance, so a consumer can verify an image before
# deploying it (ADR-0086).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

# Only a protected ref publishes (CWE-285): a tag or branch anyone with write access can push
# must not put an image under the release names. The upstream pipeline gates the same jobs on
# CI_COMMIT_REF_PROTECTED; here a tag ruleset and the main ruleset make a ref protected.
# ReleaseWorkflowGateTest keeps the gate on every job.
jobs:
  ci:
    if: github.ref_protected
    uses: ./.github/workflows/ci.yml

  # The release's documentation, attached to its GitHub release, from which pages.yml assembles
  # the versioned site (ADR-0087). Tags only: a branch build is not a release.
  docs:
    needs: ci
    if: github.ref_protected && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Release tag
        run: |
          printf '%s\n' "$TAG" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "Not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release's notes; a tag whose version has no CHANGELOG.md section fails here.
      - name: Changelog section
        run: tools/release/notes.sh changelog "$TAG" >release-notes.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/${{ github.ref_name }}/
          DOCS_VERSION: ${{ github.ref_name }}
          DOCS_REF: ${{ github.ref_name }}
        run: |
          npm ci
          npm run docs:build
      - name: Archive
        # Plain ustar: check-archive.mjs in pages.yml refuses every pax, GNU or sparse header.
        run: tar --format=ustar -czf homer-docs.tar.gz -C site/.vitepress/dist .
      # Anyone with write access can replace a release asset, so pages.yml publishes an archive
      # only when this attestation proves this workflow built it from the release's tag.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: homer-docs.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" homer-docs.tar.gz --repo "$REPO" --clobber
          else
            gh release create "$TAG" homer-docs.tar.gz --repo "$REPO" --verify-tag --title "$TAG" \
              --notes-file release-notes.md
          fi
          # A release made with GITHUB_TOKEN starts no workflow, so the site is rebuilt explicitly.
          gh workflow run pages.yml --repo "$REPO" --ref "$DEFAULT_BRANCH"

  # The tags of this run's images, computed once so that every platform build and every index
  # agrees on them. A matrix entry's tag-suffix is appended where a tag is used.
  image-tags:
    needs: ci
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tags.outputs.version }}
      moving: ${{ steps.tags.outputs.moving }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release without its CHANGELOG.md section publishes nothing.
      - name: Changelog section
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release/notes.sh changelog "$TAG" >/dev/null
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            # Re-checked here so a widened trigger filter cannot publish a non-semver tag.
            printf '%s\n' "$REF_NAME" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "Not a release tag: $REF_NAME"; exit 1; }
            echo "version=$REF_NAME" >>"$GITHUB_OUTPUT"
            echo "moving=" >>"$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)
            echo "version=$slug-${GITHUB_SHA::8}" >>"$GITHUB_OUTPUT"
            echo "moving=$slug" >>"$GITHUB_OUTPUT"
          fi

  # Each image is built natively on a runner of each platform, not under QEMU emulation, and pushed
  # by digest only: no tag names a platform image until job `images` joins all of them into one
  # index. Every platform manifest is signed and attested on its own as well (ADR-0086).
  image-builds:
    needs: image-tags
    if: github.ref_protected
    runs-on: ${{ matrix.platform.runner }}
    # Bounds the build, not the wait for a runner: GitHub does not count queue time.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        build:
          - image: homer-app
            context: .
            dockerfile: app/Dockerfile
            target: runner
            version-arg: HOMER_VERSION
          # The slim server image (ADR-0094): the same image name, its tags suffixed.
          - image: homer-app
            context: .
            dockerfile: app/Dockerfile
            target: slim
            version-arg: HOMER_VERSION
            tag-suffix: '-slim'
          - image: homer-runner
            context: .
            dockerfile: app/Dockerfile
            target: homer-runner
            version-arg: HOMER_VERSION
          - image: homer-console
            context: console
            dockerfile: console/Dockerfile
            target: runner
            version-arg: CONSOLE_VERSION
        # Every image ships for both platforms; ReleaseWorkflowGateTest keeps them.
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.build.image }}
      PLATFORM: ${{ matrix.platform.name }}
      ARCH: ${{ matrix.platform.arch }}
      TARGET: ${{ matrix.build.target }}
      DOCKERFILE: ${{ matrix.build.dockerfile }}
      CONTEXT: ${{ matrix.build.context }}
      # The release tag, suffix included, is the image's version: a build argument, and a label job
      # `images` checks so that an index can only be made of this entry's platform images.
      VERSION: ${{ needs.image-tags.outputs.version }}${{ matrix.build.tag-suffix }}
      VERSION_BUILD_ARG: ${{ matrix.build.version-arg }}=${{ needs.image-tags.outputs.version }}${{ matrix.build.tag-suffix }}
      TITLE: ${{ matrix.build.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A docker-container builder: the docker driver cannot push by digest.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # License gate. Next pulls sharp's prebuilt libvips binaries (@img/*), which are
      # LGPL-3.0-or-later, and console/Dockerfile prunes them. Pushing is what would convey
      # them, so the gate scans a local build of each platform before the push, which then
      # rebuilds from the builder's cache. It fails closed: an early exit is a failed gate.
      - name: Build for the LGPL gate
        if: matrix.build.image == 'homer-console'
        run: |
          docker buildx build --platform "$PLATFORM" --provenance=false --target "$TARGET" \
            --build-arg "$VERSION_BUILD_ARG" -f "$DOCKERFILE" --load -t homer-console:lgpl-gate "$CONTEXT"
      - name: LGPL gate
        if: matrix.build.image == 'homer-console'
        run: |
          scan=$(docker run --rm --platform "$PLATFORM" --entrypoint sh homer-console:lgpl-gate -c \
            'find / -xdev \( -name "@img" -o -name "sharp" -o -name "libvips*" \) 2>/dev/null; echo SCAN_COMPLETED')
          printf '%s\n' "$scan" | grep -qx SCAN_COMPLETED || { echo "LGPL scan did not complete; refusing to push"; exit 1; }
          hits=$(printf '%s\n' "$scan" | grep -vx SCAN_COMPLETED || true)
          if [ -n "$hits" ]; then
            echo "LGPL-3.0 (libvips) artifacts found in the console image; refusing to push:"
            printf '%s\n' "$hits"
            exit 1
          fi
      # No BuildKit provenance: it would turn the platform image into an index of its own.
      # The provenance and SBOM are attested below, as ADR-0086 decides.
      - name: Push
        id: push
        run: |
          docker buildx build --platform "$PLATFORM" --provenance=false --sbom=false --target "$TARGET" \
            --build-arg "$VERSION_BUILD_ARG" -f "$DOCKERFILE" --metadata-file build.json \
            --label "org.opencontainers.image.title=$TITLE" --label "org.opencontainers.image.version=$VERSION" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" "$CONTEXT"
          digest=$(jq -r '."containerimage.digest"' build.json)
          printf '%s\n' "$digest" | grep -qxE 'sha256:[0-9a-f]{64}' || { echo "No registry digest for $IMAGE ($PLATFORM)"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      # Supply chain (ADR-0086): everything below binds to the pushed digest, never to a tag, so a
      # tag moved later cannot borrow the signature. A failure leaves the image unsigned, and a
      # consumer that verifies refuses it.
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.platform.arch }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.platform.arch }}.cdx.json
          push-to-registry: true
      # Hands the digest and the SBOM to job `images`. The image comes last in the artifact name, so
      # one entry's download pattern cannot match another entry's artifacts (homer-app, homer-app-slim).
      - name: Platform record
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir platform
          printf '%s\n' "$DIGEST" >"platform/digest-$ARCH"
          mv "sbom-$ARCH.cdx.json" platform/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform--${{ matrix.platform.arch }}--${{ matrix.build.image }}${{ matrix.build.tag-suffix }}
          path: platform/
          if-no-files-found: error
          retention-days: 1

  # Joins each image's platform builds into one multi-arch index under the release tags, then
  # signs and attests the index digest, the digest the release page and the docs tell a consumer
  # to verify and pin (ADR-0086). Any failed platform build skips every index, so a release tag
  # never names an image that lacks a platform.
  images:
    needs: [image-tags, image-builds]
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        # Job `image-builds`' images; ReleaseWorkflowGateTest keeps the two lists equal.
        include:
          - image: homer-app
          - image: homer-app
            tag-suffix: '-slim'
          - image: homer-runner
          - image: homer-console
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform--*--${{ matrix.image }}${{ matrix.tag-suffix }}
          path: platform
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Index
        id: index
        env:
          VERSION: ${{ needs.image-tags.outputs.version }}
          MOVING: ${{ needs.image-tags.outputs.moving }}
          SUFFIX: ${{ matrix.tag-suffix }}
          TITLE: ${{ matrix.image }}
          ENTRY: ${{ matrix.image }}${{ matrix.tag-suffix }}
        run: |
          found=$(find platform -name 'digest-*' | wc -l)
          [ "$found" -eq 2 ] || { echo "Expected 2 platform digests for $ENTRY, found $found"; exit 1; }
          platforms=()
          for arch in amd64 arm64; do
            digest=$(cat "platform/platform--$arch--$ENTRY/digest-$arch")
            printf '%s\n' "$digest" | grep -qxE 'sha256:[0-9a-f]{64}' || { echo "No $arch digest for $ENTRY"; exit 1; }
            # The digest must be this entry's build for this platform: its labels name the image and
            # the version, suffix included, so a homer-app-slim digest cannot pass for homer-app.
            config=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}')
            [ "$(jq -r '.architecture' <<<"$config")" = "$arch" ] &&
              [ "$(jq -r '.config.Labels["org.opencontainers.image.title"]' <<<"$config")" = "$TITLE" ] &&
              [ "$(jq -r '.config.Labels["org.opencontainers.image.version"]' <<<"$config")" = "$VERSION$SUFFIX" ] ||
              { echo "$IMAGE@$digest is not the $arch build of $ENTRY $VERSION$SUFFIX"; exit 1; }
            platforms+=("$digest")
          done
          tags=(-t "$IMAGE:$VERSION$SUFFIX")
          if [ -n "$MOVING" ]; then tags+=(-t "$IMAGE:$MOVING$SUFFIX"); fi
          docker buildx imagetools create "${tags[@]}" "${platforms[@]/#/$IMAGE@}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION$SUFFIX" --format '{{.Manifest.Digest}}')
          printf '%s\n' "$digest" | grep -qxE 'sha256:[0-9a-f]{64}' || { echo "No index digest for $IMAGE:$VERSION$SUFFIX"; exit 1; }
          # What gets signed must be the index just made: exactly this run's platform images.
          listed=$(docker buildx imagetools inspect --raw "$IMAGE@$digest" | jq -r '.manifests[].digest' | sort)
          [ "$listed" = "$(printf '%s\n' "${platforms[@]}" | sort)" ] || { echo "$IMAGE@$digest does not list this run's platform images"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "platforms=${platforms[*]}" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Signs the index only; each platform image was signed by its own build.
      - name: Sign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      # An SBOM describes one platform's file system, so the index carries both platform SBOMs.
      - name: Attest SBOM (linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: platform/platform--amd64--${{ matrix.image }}${{ matrix.tag-suffix }}/sbom-amd64.cdx.json
          push-to-registry: true
      - name: Attest SBOM (linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: platform/platform--arm64--${{ matrix.image }}${{ matrix.tag-suffix }}/sbom-arm64.cdx.json
          push-to-registry: true
      # Verifies the way a consumer does, the index and each platform image, so a broken signature
      # or a missing attestation fails the release instead of the first deployment that checks.
      - name: Verify
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          PLATFORMS: ${{ steps.index.outputs.platforms }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for digest in "$DIGEST" $PLATFORMS; do
            cosign verify "$IMAGE@$digest" \
              --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --predicate-type https://slsa.dev/provenance/v1 >/dev/null
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --predicate-type https://cyclonedx.org/bom >/dev/null
            echo "Verified the signature, provenance and SBOM of $IMAGE@$digest"
          done

  # The release page says what was published and how to check it: the images' digests and the
  # command that verifies them, below the changelog section. Each digest is read from GHCR and
  # verified against this run's signing identity before it is listed. A re-run replaces the
  # section (tools/release/notes.sh merge).
  release-notes:
    needs: [docs, images]
    if: github.ref_protected && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Images
        run: |
          # The images job's matrix as IMAGE[:TAG-SUFFIX]; ReleaseWorkflowGateTest keeps the two lists equal.
          for entry in homer-app homer-app:-slim homer-runner homer-console; do
            image=${entry%%:*}
            suffix=${entry#"$image"}
            suffix=${suffix#:}
            digest=$(docker buildx imagetools inspect "ghcr.io/$REPO/$image:$TAG$suffix" --format '{{.Manifest.Digest}}')
            printf '%s\n' "$digest" | grep -qxE 'sha256:[0-9a-f]{64}' || { echo "No digest for $image:$TAG$suffix"; exit 1; }
            cosign verify "ghcr.io/$REPO/$image@$digest" \
              --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            printf '%s %s %s\n' "$image" "$digest" "$suffix"
          done >digests.txt
          tools/release/notes.sh images "$TAG" <digests.txt >images.md
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body >body.md
          tools/release/notes.sh merge body.md images.md >notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
