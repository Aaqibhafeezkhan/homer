# Publishes the backend, runner and console images to GHCR once the full CI passes: the GitHub
# counterpart of the upstream pipeline's build-image jobs. A bare semver tag publishes that version;
# workflow_dispatch builds <branch>-<sha> plus the moving <branch> tag, as the upstream manual jobs do.
# The GitHub repository receives no tags from the upstream sync (ADR-0085), so this runs only after
# development moves to GitHub. Every pushed image is signed with cosign and carries a CycloneDX
# SBOM and SLSA build provenance, so a consumer can verify it before deploying it (ADR-0086).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

# Only a protected ref publishes (CWE-285): a tag or branch anyone with write access can push
# must not put an image under the release names. The upstream pipeline gates the same jobs on
# CI_COMMIT_REF_PROTECTED; here a tag ruleset and the main ruleset make a ref protected.
# ReleaseWorkflowGateTest keeps the gate on both jobs.
jobs:
  ci:
    if: github.ref_protected
    uses: ./.github/workflows/ci.yml

  # The release's documentation, attached to its GitHub release, from which pages.yml assembles
  # the versioned site (ADR-0087). Tags only: a branch build is not a release.
  docs:
    needs: ci
    if: github.ref_protected && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Release tag
        run: |
          printf '%s\n' "$TAG" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "Not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release's notes; a tag whose version has no CHANGELOG.md section fails here.
      - name: Changelog section
        run: tools/release/notes.sh changelog "$TAG" >release-notes.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/${{ github.ref_name }}/
          DOCS_VERSION: ${{ github.ref_name }}
          DOCS_REF: ${{ github.ref_name }}
        run: |
          npm ci
          npm run docs:build
      - name: Archive
        # Plain ustar: check-archive.mjs in pages.yml refuses every pax, GNU or sparse header.
        run: tar --format=ustar -czf homer-docs.tar.gz -C site/.vitepress/dist .
      # Anyone with write access can replace a release asset, so pages.yml publishes an archive
      # only when this attestation proves this workflow built it from the release's tag.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: homer-docs.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" homer-docs.tar.gz --repo "$REPO" --clobber
          else
            gh release create "$TAG" homer-docs.tar.gz --repo "$REPO" --verify-tag --title "$TAG" \
              --notes-file release-notes.md
          fi
          # A release made with GITHUB_TOKEN starts no workflow, so the site is rebuilt explicitly.
          gh workflow run pages.yml --repo "$REPO" --ref "$DEFAULT_BRANCH"

  images:
    needs: ci
    if: github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: homer-app
            context: .
            dockerfile: app/Dockerfile
            target: runner
            version-arg: HOMER_VERSION
          # The slim server image (ADR-0094): the same image name, its tags suffixed.
          - image: homer-app
            context: .
            dockerfile: app/Dockerfile
            target: slim
            version-arg: HOMER_VERSION
            tag-suffix: '-slim'
          - image: homer-runner
            context: .
            dockerfile: app/Dockerfile
            target: homer-runner
            version-arg: HOMER_VERSION
          - image: homer-console
            context: console
            dockerfile: console/Dockerfile
            target: runner
            version-arg: CONSOLE_VERSION
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A release without its CHANGELOG.md section publishes nothing.
      - name: Changelog section
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release/notes.sh changelog "$TAG" >/dev/null
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.tag-suffix }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            # Re-checked here so a widened trigger filter cannot publish a non-semver tag.
            printf '%s\n' "$REF_NAME" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' || { echo "Not a release tag: $REF_NAME"; exit 1; }
            echo "version=$REF_NAME$SUFFIX" >>"$GITHUB_OUTPUT"
            echo "moving=" >>"$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-63)
            echo "version=$slug-${GITHUB_SHA::8}$SUFFIX" >>"$GITHUB_OUTPUT"
            echo "moving=$slug$SUFFIX" >>"$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          TARGET: ${{ matrix.target }}
          VERSION_ARG: ${{ matrix.version-arg }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker build --target "$TARGET" --build-arg "$VERSION_ARG=$VERSION" -f "$DOCKERFILE" -t "$IMAGE:$VERSION" "$CONTEXT"
      # License gate. Next pulls sharp's prebuilt libvips binaries (@img/*), which are
      # LGPL-3.0-or-later, and console/Dockerfile prunes them. Pushing is what would convey
      # them, so the gate sits before the push. It fails closed: an early exit is a failed gate.
      - name: LGPL gate
        if: matrix.image == 'homer-console'
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          scan=$(docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c \
            'find / -xdev \( -name "@img" -o -name "sharp" -o -name "libvips*" \) 2>/dev/null; echo SCAN_COMPLETED')
          printf '%s\n' "$scan" | grep -qx SCAN_COMPLETED || { echo "LGPL scan did not complete; refusing to push"; exit 1; }
          hits=$(printf '%s\n' "$scan" | grep -vx SCAN_COMPLETED || true)
          if [ -n "$hits" ]; then
            echo "LGPL-3.0 (libvips) artifacts found in the console image; refusing to push:"
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: Push
        id: push
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          MOVING: ${{ steps.tags.outputs.moving }}
        run: |
          docker push "$IMAGE:$VERSION"
          if [ -n "$MOVING" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:$MOVING"
            docker push "$IMAGE:$MOVING"
          fi
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$VERSION" |
            sed -n "s|^$IMAGE@||p" | head -n 1)
          printf '%s\n' "$digest" | grep -qxE 'sha256:[0-9a-f]{64}' || { echo "No registry digest for $IMAGE:$VERSION"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      # Supply chain (ADR-0086): everything below binds to the pushed digest, never to a tag, so a
      # tag moved later cannot borrow the signature. A failure leaves the image unsigned, and a
      # consumer that verifies refuses it.
      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      # Verifies the way a consumer does, so a broken signature or a missing attestation fails the
      # release instead of the first deployment that checks.
      - name: Verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type https://cyclonedx.org/bom >/dev/null
          echo "Verified the signature, provenance and SBOM of $IMAGE@$DIGEST"

  # The release page says what was published and how to check it: the images' digests and the
  # command that verifies them, below the changelog section. Each digest is read from GHCR and
  # verified against this run's signing identity before it is listed. A re-run replaces the
  # section (tools/release/notes.sh merge).
  release-notes:
    needs: [docs, images]
    if: github.ref_protected && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Images
        run: |
          # The images job's matrix as IMAGE[:TAG-SUFFIX]; ReleaseWorkflowGateTest keeps the two lists equal.
          for entry in homer-app homer-app:-slim homer-runner homer-console; do
            image=${entry%%:*}
            suffix=${entry#"$image"}
            suffix=${suffix#:}
            digest=$(docker buildx imagetools inspect "ghcr.io/$REPO/$image:$TAG$suffix" --format '{{.Manifest.Digest}}')
            printf '%s\n' "$digest" | grep -qxE 'sha256:[0-9a-f]{64}' || { echo "No digest for $image:$TAG$suffix"; exit 1; }
            cosign verify "ghcr.io/$REPO/$image@$digest" \
              --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            printf '%s %s %s\n' "$image" "$digest" "$suffix"
          done >digests.txt
          tools/release/notes.sh images "$TAG" <digests.txt >images.md
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body >body.md
          tools/release/notes.sh merge body.md images.md >notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
