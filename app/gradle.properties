# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Kotlin compile daemon heap. The default is 512m, which is not enough to
# compile this project's test sources in one pass: a full (non-incremental)
# :app:compileTestKotlin dies with "OutOfMemoryError: GC overhead limit
# exceeded" while generating code for the coroutine/mockk-heavy tests. Day-to-day
# incremental builds stay under it, so this only bites a cold cache — CI, or a
# local --rerun-tasks. Measured: 512m fails, 1g passes; 2g is that with headroom.
# Lower it to 1g if a runner cannot spare the memory (the daemon also reserves
# MaxMetaspaceSize=384m + ReservedCodeCacheSize=320m on top of the heap).
kotlin.daemon.jvmargs=-Xmx2g
