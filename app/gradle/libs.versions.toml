# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.4.21"
kotlinxSerializationJSON = "1.11.0"
kotlinxCoroutines = "1.11.0"
# Pinned to 3.5.0: 3.5.1's KTOR-9621 fix moves rate limiting before authentication,
# which breaks the principal-keyed perCaller requestKey (ADR-0014).
ktor = "3.5.0"
opentelemetry = "1.66.0"
opentelemetrySemconv = "1.44.0"
kotlinXSetializationYaml = "0.104.0"
slf4j = "2.0.20"
logback = "1.6.5"
langfuse = "0.3.0"
koin = "4.2.2"
junit = "6.1.3"
mockk = "1.14.11"
konsist = "0.18.1"
kotestProperty = "6.2.5"
pitestPlugin = "1.19.0"
pitest = "1.30.0"
pitestJunit5 = "1.2.3"
jsonPath = "3.0.0"
shadow = "9.6.1"
cronUtils = "9.2.1"
clikt = "5.1.0"
commonsCompress = "1.28.0"
jsonSchemaValidator = "3.0.8"
ktlintGradle = "14.2.0"
# ADR-0082 `detekt` check: 2.0 is the first line on the K2 Analysis API, which Kotlin 2.4 needs; move to 2.0 stable once it ships.
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
dependencyCheck = "13.0.0"
licenseReport = "3.1.4"
kubernetesClient = "27.0.0"
bcrypt = "0.10.2"
# Pinned to 0.14.0: 0.15.0 depends on ktor 3.5.1, which conflict resolution
# would raise the whole Ktor stack to, defeating the pin above (ADR-0014).
mcpKotlinSdk = "0.14.0"
exposed = "1.5.0"
sqliteJdbc = "3.53.4.0"
sshd = "2.20.0"
# Transitive-only; pinned via `constraints` in app/build.gradle.kts until the
# libraries that pull them (langfuse-java, json-schema-validator, client-java)
# ship releases on patched versions.
jackson2 = "2.22.3"
jackson3 = "3.2.3"
netty = "4.2.18.Final"
httpclient5 = "5.6.4"
httpcore5 = "5.4.4"
bouncycastle = "1.86"
bouncycastleProv = "1.86"
# Pinned to 5.4.0 / 3.17.0: the 5.5.0 / 3.18.1 POM metadata points at a project
# domain and org that are not Square (lysine.dev, github.com/lysine-dev), so the
# artifacts cannot be confirmed as Square releases. Raise the pin once the
# upstream metadata is explained.
okhttp = "5.4.0"
okio = "3.17.0"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinCompilerEmbeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
ktlintGradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
detektGradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
koverGradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinXSetializationYaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kotlinXSetializationYaml" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
ktorServerCore = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktorServerNetty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktorServerContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorServerAuth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktorServerCors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktorServerRateLimit = { module = "io.ktor:ktor-server-rate-limit", version.ref = "ktor" }
ktorServerStatusPages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktorServerDoubleReceive = { module = "io.ktor:ktor-server-double-receive", version.ref = "ktor" }
ktorServerBodyLimit = { module = "io.ktor:ktor-server-body-limit", version.ref = "ktor" }
ktorServerSessions = { module = "io.ktor:ktor-server-sessions", version.ref = "ktor" }
ktorServerCallLogging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorClientAuth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
opentelemetryApi = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetrySdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetryExporterOtlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetryExporterLogging = { module = "io.opentelemetry:opentelemetry-exporter-logging", version.ref = "opentelemetry" }
opentelemetrySemconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version.ref = "opentelemetrySemconv" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
langfuseClient = { module = "com.langfuse:langfuse-java", version.ref = "langfuse" }
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinKtor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
jsonPath = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonPath" }
cronUtils = { module = "com.cronutils:cron-utils", version.ref = "cronUtils" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
commonsCompress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
kubernetesClient = { module = "io.kubernetes:client-java", version.ref = "kubernetesClient" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
mcpKotlinSdkServer = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcpKotlinSdk" }
exposedCore = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposedJdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqliteJdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
sshdCore = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshdSftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
jackson2Databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson3Databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastleProv" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
nettyBom = { module = "io.netty:netty-bom", version.ref = "netty" }
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5H2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }
# `strictly` because a plain constraint cannot downgrade: the consumers request
# 5.5.0 / 3.18.1, and conflict resolution keeps the highest request.
okhttp = { module = "com.squareup.okhttp3:okhttp", version = { strictly = "5.4.0" } }
okio = { module = "com.squareup.okio:okio", version = { strictly = "3.17.0" } }


# Testing
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinTestJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockkAgent = { module = "io.mockk:mockk-agent", version.ref = "mockk" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
koinTest = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koinTestJunit5 = { module = "io.insert-koin:koin-test-junit5", version.ref = "koin" }
ktorServerTest = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
jsonSchemaValidator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotestProperty = { module = "io.kotest:kotest-property", version.ref = "kotestProperty" }

# Libraries can be bundled together for easier import
[bundles]
ktor = ["ktorServerCore", "ktorServerNetty", "ktorServerContentNegotiation", "ktorSerializationKotlinxJson", "ktorServerAuth", "ktorServerCors", "ktorServerRateLimit", "ktorServerStatusPages", "ktorServerDoubleReceive", "ktorServerSessions", "ktorServerCallLogging", "ktorServerBodyLimit"]
ktorClient = ["ktorClientCore", "ktorClientCio", "ktorClientContentNegotiation", "ktorClientAuth"]
opentelemetry = ["opentelemetryApi", "opentelemetrySdk", "opentelemetryExporterOtlp", "opentelemetrySemconv", "opentelemetryExporterLogging"]
koin = ["koinCore", "koinKtor"]
persistence = ["exposedCore", "exposedJdbc", "sqliteJdbc"]
sshd = ["sshdCore", "sshdSftp"]
testing = ["kotlinTest", "kotlinTestJunit5", "junitJupiter", "mockk", "mockkAgent", "kotlinxCoroutinesTest", "koinTest", "koinTestJunit5", "ktorServerTest", "ktorClientMock", "jsonSchemaValidator"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dependencyCheck = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
licenseReport = { id = "com.github.jk1.dependency-license-report", version.ref = "licenseReport" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitestPlugin" }