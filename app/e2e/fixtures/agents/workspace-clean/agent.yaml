name: workspace-clean
description: Fixed workspace path + cleanAfterFinish true — a marker never survives to the next run
workspace:
  path: e2e-workspace-clean
  cleanAfterFinish: true
commands:
  - !<script>
    label: probe-marker
    content: |
      if [ -f "$HMR_WORK_DIR/marker" ]; then echo "marker=present"; else echo "marker=absent"; fi
      echo x > "$HMR_WORK_DIR/marker"
