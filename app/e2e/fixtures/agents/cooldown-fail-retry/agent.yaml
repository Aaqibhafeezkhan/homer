name: cooldown-fail-retry
description: Always fails with exit code 7 after a short delay; cooldown fixture with only afterFailure set, for the retry admission test
cooldown:
  afterFailure: 1h
commands:
  - !<script>
    label: fail-loudly
    content: |
      sleep 1
      echo "deliberate cooldown-fail-retry failure" >&2
      exit 7
